[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/entity",
    "crates/migration",
    "crates/service",
    "crates/server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# internal crates
common = { path = "crates/common" }
entity = { path = "crates/entity" }
migration = { path = "crates/migration" }
service = { path = "crates/service" }

# web / runtime
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit", "timeout"] }

# orm / db / auth engine
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
casbin = "2"
sqlx-adapter = { version = "1", features = ["postgres"], default-features = false }
deadpool-redis = "0.18"

# auth / security
jsonwebtoken = "9"
argon2 = "0.5"

# openapi / docs
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# utils
validator = { version = "0.19", features = ["derive"] }
config = "0.15"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
cron = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
bytes = "1"
sysinfo = "0.32"

[profile.dev]
# faster incremental builds
debug = 1
