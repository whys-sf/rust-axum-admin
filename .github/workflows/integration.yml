name: Integration

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d admin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/admin
      REDIS_URL: redis://localhost:6379
      STORAGE__ENDPOINT: http://localhost:9000
      STORAGE__BUCKET: admin
      STORAGE__ACCESS_KEY: minioadmin
      STORAGE__SECRET_KEY: minioadmin
      # sqlx-adapter uses compile-time-checked queries; build against its bundled
      # offline data instead of the (empty) live DB. Runtime still uses DATABASE_URL.
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # MinIO can't run as a GitHub service container (it needs the `server`
      # subcommand), so start it manually. The app auto-creates the bucket on boot.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO failed to start"; docker logs minio; exit 1

      - name: Run integration tests
        run: cargo test -p server --test api -- --ignored --test-threads=1
