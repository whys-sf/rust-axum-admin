services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # development mode: permissive CORS + swagger + a dev JWT secret (see
      # config/development.toml). For a real deployment set RUN_MODE=production
      # and provide your own JWT__SECRET.
      RUN_MODE: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/admin
      REDIS_URL: redis://redis:6379
      SERVER__ADDR: 0.0.0.0:8080
      RUST_LOG: info,sqlx=warn,sea_orm=warn
    ports:
      - "8080:8080"

volumes:
  pgdata:
